name: flutter_network_scanner
description: High-performance local network scanner and device discovery plugin for Flutter with multi-threaded subnet sweep, UPnP/SSDP, mDNS, and TCP port probing.
version: 1.0.0
homepage: https://github.com/example/flutter_network_scanner
repository: https://github.com/example/flutter_network_scanner
issue_tracker: https://github.com/example/flutter_network_scanner/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_network_scanner
        pluginClass: FlutterNetworkScannerPlugin
